[project]
name = "txparser"
version = "1.0.0"
description = "Bitcoin raw transaction parser (OE Blockchain, Lab 01)"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["txparser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
